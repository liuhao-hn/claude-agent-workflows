name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ruff 检查
        run: |
          pip install ruff
          ruff check caw.py scripts tests skills/resume-generator/build_resume_example.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行单元测试
        run: python -m unittest tests.test_caw
      - name: caw CLI 可用
        run: python caw.py --help
      - name: 端到端 demo
        run: bash examples/commander-executor/demo.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 覆盖率报告
        run: |
          pip install coverage
          coverage run --source=caw -m unittest tests.test_caw
          coverage report -m

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PII 泄露扫描
        run: python scripts/pii_scan.py
