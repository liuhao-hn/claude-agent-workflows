[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-multi-agent-workflows"
version = "0.1.0"
description = "Claude 多 Agent 工作流编排 CLI 与 Skill 集合（commander-executor 落地工具）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "liuhao-hn" }]
keywords = ["claude", "codex", "multi-agent", "workflow", "orchestration"]

[project.scripts]
caw = "caw:main"

[tool.setuptools]
py-modules = ["caw"]

[tool.setuptools.data-files]
"share/claude-multi-agent-workflows" = [
    "templates/*.tpl",
    "skills/*/SKILL.md",
    "skills/*/references/*",
    "skills/*/examples/*",
    "skills/resume-generator/build_resume_example.py",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "EXE"]
ignore = ["DTZ"]
